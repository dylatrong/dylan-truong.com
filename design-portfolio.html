<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dylan Truong | Links</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="images/favicon.png">

    <link rel="stylesheet" href="styles/styles.css">

    <style>
        .link-tree-container {
            max-width: 600px; 
            margin: 0 auto;
            /* Adjusted padding to clear your fixed header and sit above the footer */
            padding: 150px 20px 100px 20px; 
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 70vh;
        }

        .link-tree-links {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
        }

        .link-tree-btn {
            display: block;
            width: 100%;
            padding: 18px 30px;
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            border-radius: 30px;
            font-family: var(--font-heading);
            font-weight: 500;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.3s ease, background-color 0.3s ease, color 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }

        .link-tree-btn:hover {
            transform: translateY(-3px);
            background-color: var(--accent-color);
            color: #ffffff;
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body>

    <div data-include="components/header.html"></div>

    <main class="link-tree-container">
        <div class="link-tree-links">
            <a href="https://www.dylatrong.com/the-armory/" class="link-tree-btn">The Armory</a>
            <a href="design-portfolio/newleaf/newleaf.html" class="link-tree-btn">NewLeaf</a>
        </div>
    </main>

    <div data-include="components/footer.html"></div>

    <script src="scripts/HTMLInclude.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const navbar = document.querySelector('.navbar');
            
            if(navbar) {
                const handleScroll = () => {
                    if (window.scrollY > 50) {
                        navbar.classList.add('scrolled');
                    } else {
                        navbar.classList.remove('scrolled');
                    }
                };

                window.addEventListener('scroll', handleScroll);
            }
        });
    </script>
</body>
</html>
